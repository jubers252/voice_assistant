          - heading "About this item" [level=1] [ref=e834]
          - list [ref=e835]:
            - listitem [ref=e836]: HELLO, MACBOOK NEO — Ready for whatever your day brings, MacBook Neo flies through everyday tasks and apps. Choose from four stunning colours in a durable aluminium design. With a brilliant 33.02 cm (13″) Liquid Retina display, the A18 Pro chip built for AI and Apple Intelligence, and up to 16 hours of battery life, it’s an amazing Mac at a surprising price.
            - listitem [ref=e837]: THE MOST COLOURFUL MACBOOK LINE-UP EVER — Choose from Silver, Blush, Citrus or Indigo — each with a colour-coordinated keyboard to complete the look. And with a durable aluminium design, MacBook Neo is built to go wherever you go.
            - listitem [ref=e838]: POWER FOR EVERYDAY TASKS — Ready the moment you open it, MacBook Neo with the A18 Pro chip delivers the performance and AI capabilities you need to get things done, whether you’re editing family photos, powering through spreadsheets, using AI to summarise class notes or playing the latest Apple Arcade game.
            - listitem [ref=e839]: UP TO 16 HOURS OF BATTERY LIFE — With all-day battery life, MacBook Neo is equipped to go the distance for everyday users and students — from early-morning classes to late-night study sessions.
            - listitem [ref=e840]: A BRILLIANT 33.02 CM (13″) DISPLAY — Feast your eyes on the gorgeous Liquid Retina display. A 2408x1506 resolution, up to 500 nits of brightness and support for a billion colours provide vivid images and crisp text.
