                    - generic [ref=e1783]:
                      - generic [ref=e1789]:
                        - paragraph [ref=e1790]: Here is my take after using it for few days
                        - paragraph [ref=e1791]: I will write the pros first because it has many.
                        - paragraph
                        - paragraph [ref=e1792]: 1. The weight is almost negligible. You can carry it everywhere without feeling the weight of the laptop.
                        - paragraph
                        - paragraph [ref=e1793]: 2. It has good multitasking capabilities.
                        - paragraph
                        - paragraph [ref=e1794]: 3. Display is really good.
                        - paragraph
                        - paragraph [ref=e1795]: 4. The speakers are top‑notch quality and have decent loudness, which is sufficient for playing videos without attaching headphones.
                        - paragraph
                        - paragraph [ref=e1796]: 5. The price point is also decent for a MacBook experience.
                        - paragraph
                        - paragraph [ref=e1797]: 6. If you have a little more budget and you get something in the range of 80–90 thousand, then go for that one.
                        - paragraph
                        - paragraph [ref=e1798]: 7. I also attached an SDMI cable through a multi‑USB extension that attaches to the Type‑C port of the mac.
                        - paragraph
                        - paragraph [ref=e1799]: 8. Decent for everyday tasks, especially office use.
                        - paragraph [ref=e1800]: I am not sure about video editing tasks because that is not my core need.
                        - paragraph [ref=e1801]: All the other things I could use are on this Macbook.
                        - paragraph
                        - paragraph [ref=e1802]: 9. It offers great value for money based on its performance, smooth operation, and suitability for everyday tasks. Its speed, quality, and display are impressive, and the price is reasonable. Additionally, the device is lightweight, making it comfortable to carry anywhere.
                        - paragraph
                        - paragraph [ref=e1803]: Cons
                        - paragraph [ref=e1804]: 1. It comes with only two USB‑C ports, no other USB ports. One of these is occupied as a power source whenever you attach it to the power cable. So you are left with only one USB‑C port for all the other extensions—mouse, HDMI, external drive, pendrive, or anything you want to use with it. You will definitely need a multi‑port extension that attaches to the USB‑C port; without that, I think you will be out of options.
                        - paragraph
                        - paragraph [ref=e1805]: 2. All those applications that support standard MacBooks do not support this Mac. That is what I observed.
                        - paragraph
                        - paragraph [ref=e1806]: 3. Still figuring out and coming across a few bugs that might eventually be solved by Apple in the coming software updates, I think. One I came across is that while installing an app from the App Store, it won't show the install button on your screen. I had to attach it to an external HDMI screen, and there, I could see the install button and install the apps, without which there was no other option.
